<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Interativa - Dia das Crianças</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="logo%20icon%20TV%20do%20Ponto%20FCV.png" type="image/png">
    <link rel="apple-touch-icon" href="logo%20icon%20TV%20do%20Ponto%20FCV.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; padding: 0; background-color: #000; color: white; 
            font-family: 'Montserrat', sans-serif; overflow: hidden;
        }

        #viewportWrapper {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden;
        }

        .tv-scale-box {
            width: 1920px; height: 1080px; 
            position: absolute; top: 50%; left: 50%;
            transform-origin: center center;
            background-image: url('BG%20TV%20Interativa%20-%20Dia%20das%20Crian%C3%A7as.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }
        
        #btnFullscreen {
            position: fixed; top: 20px; right: 20px; z-index: 99999;
            background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.5);
            padding: 10px 15px; border-radius: 8px; cursor: pointer; font-family: 'Montserrat', sans-serif;
            font-weight: 600; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: 0.3s;
        }
        #btnFullscreen:hover { background: rgba(255,255,255,0.4); }

        .marca-dagua {
            position: absolute; top: 25px; right: 40px; width: 200px;
            opacity: 0.7; z-index: 9990; pointer-events: none;
        }

        .qr-code-tv {
            position: absolute; bottom: 40px; right: 40px; width: 140px;
            background: rgba(255,255,255,0.9); padding: 10px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 9990;
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out; 
            pointer-events: none;
        }

        #relogioTV {
            position: absolute; bottom: 40px; right: 40px;
            background: rgba(255, 255, 255, 0.5); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-radius: 12px; color: #224387; 
            padding: 10px 25px; text-align: center;
            font-size: 32px; font-weight: 700; letter-spacing: 2px;
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out; 
            z-index: 9990; pointer-events: none;
        }

        .container-master { 
            width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; 
            position: absolute; top:0; left:0; 
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out; 
        }

        .moldura-sobreposicao {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 5; pointer-events: none;
        }

        .escondido { opacity: 0; pointer-events: none; transform: scale(1.02); }
        .visivel { opacity: 1; pointer-events: auto; transform: scale(1); }

        #imgPainel { width: 100%; height: 100%; object-fit: contain; position: relative; z-index: 2; }
        .modo-arte { object-fit: cover !important; }

        .nome-rodape { 
            position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            border-radius: 30px; color: #ffffff;
            padding: 20px 55px; text-align: center;
            transition: opacity 1s ease-in-out;
            z-index: 10;
        }
        .nome-rodape .titular { font-size: 40px; font-weight: 700; letter-spacing: 1.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }
        .nome-rodape .setor { font-size: 24px; font-weight: 400; opacity: 0.9; margin-top: 5px; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }

        #numeroDiscreto {
            position: absolute; bottom: 30px; left: 40px; font-size: 35px; font-weight: 800;
            color: #224387; z-index: 15; text-shadow: 0 1px 2px rgba(255,255,255,0.8); 
            transition: opacity 1s;
        }

        #containerTexto {
            width: 80%; text-align: center; background: rgba(34, 67, 135, 0.85);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 80px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
        }
        #textoDoComunicado { font-size: 70px; font-weight: 700; line-height: 1.3; margin: 0; color: #fff; }
        .aviso-label { font-size: 30px; color: #ff9800; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; display: block;}

        #aguardando { font-size: 20px; color: #ff9800; font-weight: 300; z-index: 20; }

        #barraProgressoContainer { position: absolute; bottom: 0; left: 0; width: 100%; height: 10px; background: rgba(255,255,255,0.1); z-index: 20; }
        /* A transição aqui é muito rápida (0.1s) para a barra acompanhar os milissegundos fluidamente */
        #barraProgresso { height: 100%; width: 0%; background: linear-gradient(to right, #224387, #002061); transition: width 0.1s linear; }
    </style>
</head>
<body>

    <button id="btnFullscreen">Tela Cheia</button>

    <div id="viewportWrapper">
        <div class="tv-scale-box" id="tvScaleBox">
            
            <img src="MKTFCV.png" class="marca-dagua" alt="MKT FCV">
            
            <img src="qcoude%20fotos.png" id="qrCodeTV" class="qr-code-tv escondido" alt="QR Code">
            <div id="relogioTV" class="escondido">--:--</div>

            <div id="aguardando">Aguardando conteúdos...</div>

            <div class="container-master escondido" id="camadaImagem">
                <img id="imgPainel" src="" alt="Painel">
                <img id="molduraFoto" src="escaneie%20e%20mande%20a%20sua.png" class="moldura-sobreposicao" alt="Moldura">
                <div class="nome-rodape" id="nomePainel">
                    <div class="titular" id="lblNome"></div>
                    <div class="setor" id="lblSetor"></div>
                </div>
            </div>

            <div class="container-master escondido" id="camadaTexto">
                <div id="containerTexto">
                    <span class="aviso-label">📢 Mural da Fundação</span>
                    <h1 id="textoDoComunicado"></h1>
                </div>
            </div>

            <div id="numeroDiscreto"></div>
            <div id="barraProgressoContainer"><div id="barraProgresso"></div></div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        function ajustarEscala() {
            const scaleBox = document.getElementById('tvScaleBox');
            const scaleX = window.innerWidth / 1920;
            const scaleY = window.innerHeight / 1080;
            scaleBox.style.transform = `translate(-50%, -50%) scale(${scaleX}, ${scaleY})`;
        }
        window.addEventListener('resize', ajustarEscala);
        ajustarEscala(); 

        document.getElementById('btnFullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
                document.getElementById('btnFullscreen').style.display = 'none'; 
            }
        });

        function atualizarRelogio() {
            const agora = new Date();
            const horaString = agora.toLocaleTimeString('pt-BR', { 
                timeZone: 'America/Sao_Paulo', 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            document.getElementById('relogioTV').innerText = horaString;
        }
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();

        const firebaseConfig = {
            apiKey: "AIzaSyB8ZK0jSY-1E9y90TLfznxi9PI8mf_bJuc",
            authDomain: "festadafirmafcv.firebaseapp.com",
            projectId: "festadafirmafcv",
            storageBucket: "festadafirmafcv.firebasestorage.app",
            messagingSenderId: "930815464098",
            appId: "1:930815464098:web:890c2300a6e1a79abd3dfb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let playlist = [];
        let fotosAprovadas = [];
        let comunicadosAtivos = [];
        let lastRenderedSlotIndex = -1;

        const camadaImagem = document.getElementById('camadaImagem');
        const imgPainel = document.getElementById('imgPainel');
        const molduraFoto = document.getElementById('molduraFoto'); 
        const nomePainel = document.getElementById('nomePainel');
        const lblNome = document.getElementById('lblNome');
        const lblSetor = document.getElementById('lblSetor');
        const camadaTexto = document.getElementById('camadaTexto');
        const textoDoComunicado = document.getElementById('textoDoComunicado');
        const numDiscreto = document.getElementById('numeroDiscreto');
        const aguardando = document.getElementById('aguardando');
        const barraProgresso = document.getElementById('barraProgresso');
        const qrCodeTV = document.getElementById('qrCodeTV');
        const relogioTV = document.getElementById('relogioTV');

        function construirPlaylist() {
            playlist = [];
            comunicadosAtivos.forEach((c, i) => playlist.push({ type: 'com', data: c, id: 'c'+i, duration: 15000 }));
            fotosAprovadas.forEach((f, i) => playlist.push({ type: 'foto', data: f, id: 'f'+i, duration: 8000 }));
        }

        onSnapshot(query(collection(db, "fotos_criancas"), where("status", "==", "aprovado")), (snapshot) => {
            fotosAprovadas = [];
            snapshot.forEach(doc => fotosAprovadas.push(doc.data()));
            fotosAprovadas.sort((a, b) => (a.numeroFila || 0) - (b.numeroFila || 0));
            construirPlaylist();
        });

        onSnapshot(collection(db, "comunicados_criancas"), (snapshot) => {
            comunicadosAtivos = [];
            snapshot.forEach(doc => comunicadosAtivos.push(doc.data()));
            construirPlaylist();
        });

        function runSync() {
            if (playlist.length === 0) {
                aguardando.style.display = "block";
                transicaoApagarTudo();
                lastRenderedSlotIndex = -1;
                return;
            } else {
                aguardando.style.display = "none";
            }

            const now = Date.now();
            const totalCycle = playlist.reduce((acc, el) => acc + el.duration, 0);
            
            const cycleTime = now % totalCycle; 

            let offset = 0;
            let currentSlot = 0;
            let currentSlotStart = 0;

            for (let i = 0; i < playlist.length; i++) {
                if (cycleTime >= offset && cycleTime < offset + playlist[i].duration) {
                    currentSlot = i;
                    currentSlotStart = offset;
                    break;
                }
                offset += playlist[i].duration;
            }

            let timeInSlot = cycleTime - currentSlotStart;
            let percent = (timeInSlot / playlist[currentSlot].duration) * 100;
            barraProgresso.style.width = percent + '%';

            if (currentSlot !== lastRenderedSlotIndex) {
                lastRenderedSlotIndex = currentSlot;
                renderizarItemAoVivo(playlist[currentSlot]);
            }
        }
        
        setInterval(runSync, 100);

        function renderizarItemAoVivo(item) {
            transicaoApagarTudo();
            const currentId = item.id;
            const data = item.data;

            if (item.type === 'foto' || (item.type === 'com' && (data.tipo === 'imagem' || data.url_imagem))) {
                const url = data.url_imagem || data.url_thumb;
                const imgPreload = new Image();
                
                imgPreload.onload = () => {
                    if (playlist[lastRenderedSlotIndex] && playlist[lastRenderedSlotIndex].id === currentId) {
                        exibirConteudo(item);
                    }
                };
                imgPreload.src = url;
            } else {
                setTimeout(() => {
                    if (playlist[lastRenderedSlotIndex] && playlist[lastRenderedSlotIndex].id === currentId) {
                        exibirConteudo(item);
                    }
                }, 800);
            }
        }

        function exibirConteudo(item) {
            const data = item.data;
            
            if (item.type === 'foto') {
                imgPainel.classList.remove('modo-arte'); 
                imgPainel.src = data.url_imagem;
                numDiscreto.innerText = data.numeroFila ? `#${data.numeroFila}` : "";
                numDiscreto.style.opacity = 1;
                molduraFoto.style.display = 'block';

                if(data.nome === "Anônimo" && !data.setor) {
                    nomePainel.style.display = 'none';
                } else {
                    nomePainel.style.display = 'block';
                    lblNome.innerText = data.nome;
                    lblSetor.innerText = data.setor ? data.setor : "";
                }

                camadaImagem.classList.remove('escondido'); camadaImagem.classList.add('visivel');
                qrCodeTV.classList.remove('escondido'); qrCodeTV.classList.add('visivel');
                
            } else {
                if(data.tipo === 'imagem' || data.url_imagem) {
                    imgPainel.classList.add('modo-arte'); 
                    imgPainel.src = data.url_imagem;
                    nomePainel.style.display = 'none'; 
                    numDiscreto.style.opacity = 0;     
                    molduraFoto.style.display = 'none'; 
                    
                    camadaImagem.classList.remove('escondido'); camadaImagem.classList.add('visivel');
                    relogioTV.classList.remove('escondido'); relogioTV.classList.add('visivel');
                } else {
                    textoDoComunicado.innerText = data.texto;
                    numDiscreto.style.opacity = 0;
                    molduraFoto.style.display = 'none';
                    
                    camadaTexto.classList.remove('escondido'); camadaTexto.classList.add('visivel');
                    relogioTV.classList.remove('escondido'); relogioTV.classList.add('visivel');
                }
            }
        }

        function transicaoApagarTudo() {
            camadaImagem.classList.remove('visivel'); camadaImagem.classList.add('escondido');
            camadaTexto.classList.remove('visivel'); camadaTexto.classList.add('escondido');
            qrCodeTV.classList.remove('visivel'); qrCodeTV.classList.add('escondido');
            relogioTV.classList.remove('visivel'); relogioTV.classList.add('escondido');
            numDiscreto.style.opacity = 0;
        }
    </script>
</body>
</html>
