<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Corporativa - FCV</title>
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="logo%20icon%20TV%20do%20Ponto%20FCV.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: white; font-family: 'Montserrat', sans-serif; overflow: hidden; }
        #viewportWrapper { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; }
        .tv-scale-box { width: 1920px; height: 1080px; position: absolute; top: 50%; left: 50%; transform-origin: center center; background-color: #000; }
        #btnFullscreen { position: fixed; top: 20px; right: 20px; z-index: 99999; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.5); padding: 10px 15px; border-radius: 8px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-weight: 600; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: 0.3s; }
        #btnFullscreen:hover { background: rgba(255,255,255,0.4); }
        .marca-dagua { position: absolute; top: 25px; right: 40px; width: 200px; opacity: 0.7; z-index: 9990; pointer-events: none; }
        #relogioTV { position: absolute; bottom: 40px; right: 40px; background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 4px 15px rgba(0,0,0,0.3); border-radius: 12px; color: #224387; padding: 10px 25px; text-align: center; font-size: 32px; font-weight: 700; letter-spacing: 2px; z-index: 9990; pointer-events: none; }
        body[data-transicao="fade"] .container-master { transition: opacity 0.8s ease; }
        body[data-transicao="fade"] .escondido { opacity: 0; pointer-events: none; }
        body[data-transicao="fade"] .visivel { opacity: 1; pointer-events: auto; }
        body[data-transicao="slide"] .container-master { transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out; }
        body[data-transicao="slide"] .escondido { transform: translateX(100%); opacity: 0; pointer-events: none; }
        body[data-transicao="slide"] .visivel { transform: translateX(0); opacity: 1; pointer-events: auto; }
        body[data-transicao="zoom"] .container-master { transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out; }
        body[data-transicao="zoom"] .escondido { transform: scale(0.9); opacity: 0; pointer-events: none; }
        body[data-transicao="zoom"] .visivel { transform: scale(1); opacity: 1; pointer-events: auto; }
        .container-master { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: absolute; top:0; left:0; }
        .moldura-sobreposicao { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 5; pointer-events: none; }
        #imgPainel1, #imgPainel2 { width: 100%; height: 100%; object-fit: contain; position: relative; z-index: 2; }
        .modo-arte { object-fit: cover !important; }
        .nome-rodape { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); border-radius: 30px; color: #ffffff; padding: 20px 55px; text-align: center; transition: opacity 1s ease-in-out; z-index: 10; }
        .nome-rodape .titular { font-size: 40px; font-weight: 700; letter-spacing: 1.5px; text-shadow: 0 2px 4px rgba(0, 32, 97, 0.4), 0 1px 2px rgba(0, 32, 97, 0.6); }
        .nome-rodape .setor { font-size: 24px; font-weight: 400; opacity: 0.9; margin-top: 5px; text-shadow: 0 2px 6px #002061, 0 0 4px #002061; }
        #numeroDiscreto { position: absolute; bottom: 30px; left: 40px; font-size: 35px; font-weight: 800; color: #224387; z-index: 15; text-shadow: 0 1px 2px rgba(255,255,255,0.8); transition: opacity 1s; }
        #containerTexto { width: 80%; text-align: center; background: rgba(34, 67, 135, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 80px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        #textoDoComunicado { font-size: 70px; font-weight: 700; line-height: 1.3; margin: 0; color: #fff; }
        .aviso-label { font-size: 30px; color: #ff9800; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; display: block;}
        #aguardando { font-size: 20px; color: #7f8c8d; font-weight: 600; z-index: 20; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; }
        #barraProgressoContainer { position: absolute; bottom: 0; left: 0; width: 100%; height: 10px; background: rgba(255,255,255,0.1); z-index: 20; }
        #barraProgresso { height: 100%; width: 0%; background: linear-gradient(to right, #2894f9, #002061); }
        
        #bgClima { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 1; overflow: hidden; transition: background 1.5s ease; }
        
        .clima-sol { background: linear-gradient(135deg, #2575fc 0%, #1a4d8c 55%, #0f2c59 100%) !important; }
        .clima-parc-nublado { background: linear-gradient(135deg, #306596 0%, #1c3b63 55%, #0d1f38 100%) !important; }
        .clima-nublado { background: linear-gradient(135deg, #37474F 0%, #1c262b 100%) !important; }
        .clima-chuva { background: linear-gradient(135deg, #2b3b4e 0%, #11171f 100%) !important; }
        .clima-tempestade { background: linear-gradient(135deg, #0d131d 0%, #05070b 100%) !important; }
        
        #flashTempestade {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 4; opacity: 0;
            transition: opacity 0.04s ease-out;
        }

        #sunCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none; display: none;
        }

        .nuvens-container { position: absolute; top: 0; left: 0; width: 100%; height: 600px; pointer-events: none; z-index: 3; overflow: hidden; display: none; }
        .clima-nublado .nuvens-container, .clima-parc-nublado .nuvens-container, .clima-chuva .nuvens-container, .clima-tempestade .nuvens-container { display: block; }
        
        .clima-nublado::before, .clima-parc-nublado::before, .clima-chuva::before, .clima-tempestade::before { content: ""; position: absolute; width: 1200px; height: 600px; top: 5%; left: -200px; background: rgba(255,255,255,0.06); filter: blur(60px); border-radius: 50%; animation: moverNuvem 20s ease-in-out infinite alternate; pointer-events: none; z-index: 2;}
        .clima-nublado::after, .clima-parc-nublado::after, .clima-chuva::after, .clima-tempestade::after { content: ""; position: absolute; width: 1000px; height: 500px; bottom: 10%; right: -200px; background: rgba(255,255,255,0.04); filter: blur(50px); border-radius: 50%; animation: moverNuvem 25s ease-in-out infinite alternate-reverse; pointer-events: none; z-index: 2;}

        .nuvem-ios { position: absolute; border-radius: 100px; filter: blur(12px); transition: background 0.1s ease; }
        .nuvem-ios::before, .nuvem-ios::after { content: ''; position: absolute; background: inherit; border-radius: 50%; }
        
        .nuvem-ios.n1 { width: 420px; height: 130px; top: 30px; left: -550px; animation: passaNuvem 50s linear infinite; background: rgba(45, 65, 85, 0.35); }
        .nuvem-ios.n1::before { width: 190px; height: 190px; top: -80px; left: 50px; }
        .nuvem-ios.n1::after { width: 130px; height: 130px; top: -60px; right: 60px; }
        
        .nuvem-ios.n2 { width: 520px; height: 150px; top: 100px; left: -700px; animation: passaNuvem 68s linear infinite 12s; background: rgba(30, 45, 60, 0.45); }
        .nuvem-ios.n2::before { width: 220px; height: 220px; top: -100px; left: 70px; }
        .nuvem-ios.n2::after { width: 160px; height: 160px; top: -70px; right: 70px; }
        
        .nuvem-ios.n3 { width: 340px; height: 110px; top: 160px; left: -450px; animation: passaNuvem 40s linear infinite 4s; background: rgba(255, 255, 255, 0.12); }
        .nuvem-ios.n3::before { width: 150px; height: 150px; top: -70px; left: 40px; }
        .nuvem-ios.n3::after { width: 100px; height: 100px; top: -45px; right: 40px; }

        .trovao-ativo .nuvem-ios { background: rgba(210, 230, 255, 0.28) !important; }
        
        @keyframes passaNuvem { 0% { transform: translateX(-10%); } 100% { transform: translateX(2500px); } }
        @keyframes moverNuvem { 0% { transform: translateX(0); } 100% { transform: translateX(300px); } }

        .header-clima { position: absolute; top: 80px; left: 0; width: 100%; text-align: center; z-index: 5;}
        .cidade-clima { font-size: 45px; font-weight: 600; margin: 0; color: #fff; letter-spacing: 1px;}
        .sub-clima { font-size: 22px; font-weight: 300; color: #bdc3c7; margin-top: 5px; }
        .grid-clima { display: grid; grid-template-columns: repeat(7, 1fr); gap: 20px; width: 90%; max-width: 1750px; z-index: 5; margin-top: 90px; }
        .card-dia { background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-radius: 24px; padding: 30px 15px; border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; display: flex; flex-direction: column; align-items: center; position: relative;}
        .dia-titulo { font-size: 32px; font-weight: 600; color: #fff; margin-bottom: 25px; }
        .dia-hoje { color: #3498db; }
        .icone-principal svg { width: 100px; height: 100px; margin-bottom: 20px;}
        .temp-principal { font-size: 70px; font-weight: 300; line-height: 1; margin-bottom: 10px; }
        .desc-principal { font-size: 16px; font-weight: 600; color: #bdc3c7; height: 40px; margin-bottom: 20px; }
        .maxmin { font-size: 22px; font-weight: 600; display: flex; gap: 15px; margin-bottom: 30px; }
        .t-max { color: #e74c3c; } .t-min { color: #3498db; }
        .turnos-container { display: flex; justify-content: space-around; width: 100%; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
        .turno { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .turno-nome { font-size: 14px; font-weight: 600; color: #bdc3c7; text-transform: uppercase; }
        .turno-icone svg { width: 35px; height: 35px; }
        .turno-temp { font-size: 18px; font-weight: 600; }
        
        #rainCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 6; pointer-events: none; display: none; }
    </style>
</head>
<body data-transicao="fade">

    <audio id="radioFCV" src="https://stm17.srvstm.com:6944/stream" preload="none" crossorigin="anonymous"></audio>

    <button id="btnFullscreen">Tela Cheia</button>

    <div id="viewportWrapper">
        <div class="tv-scale-box" id="tvScaleBox">
            
            <img src="MKTFCV.png" class="marca-dagua" alt="MKT FCV">
            <div id="relogioTV">--:--</div>

            <div id="aguardando">Aguardando informações da rede...</div>

            <div class="container-master escondido" id="camadaClima">
                <div id="bgClima">
                    <canvas id="sunCanvas"></canvas>
                    
                    <div class="nuvens-container">
                        <div class="nuvem-ios n1"></div>
                        <div class="nuvem-ios n2"></div>
                        <div class="nuvem-ios n3"></div>
                    </div>

                    <div id="flashTempestade"></div>
                </div>
                <canvas id="rainCanvas"></canvas>
                <div class="header-clima">
                    <h1 class="cidade-clima">Previsão do Tempo - Muriaé, MG</h1>
                    <div class="sub-clima">Fonte: Satélite Open-Meteo</div>
                </div>
                <div class="grid-clima" id="gridClima"></div>
            </div>
            
            <div class="container-master escondido" id="camadaImagem1">
                <img id="imgPainel1" src="" alt="Painel">
                <img id="molduraFoto1" src="escaneie%20e%20mande%20a%20sua.png" class="moldura-sobreposicao" style="display:none;" alt="Moldura">
                <div class="nome-rodape" id="nomePainel1" style="display:none;">
                    <div class="titular" id="lblNome1"></div>
                    <div class="setor" id="lblSetor1"></div>
                </div>
            </div>

            <div class="container-master escondido" id="camadaImagem2">
                <img id="imgPainel2" src="" alt="Painel">
                <img id="molduraFoto2" src="escaneie%20e%20mande%20a%20sua.png" class="moldura-sobreposicao" style="display:none;" alt="Moldura">
                <div class="nome-rodape" id="nomePainel2" style="display:none;">
                    <div class="titular" id="lblNome2"></div>
                    <div class="setor" id="lblSetor2"></div>
                </div>
            </div>

            <div class="container-master escondido" id="camadaVideo">
                <video id="videoPainel" class="modo-arte" src="" playsinline muted></video>
            </div>
            <div class="container-master escondido" id="camadaTexto">
                <div id="containerTexto">
                    <span class="aviso-label">Mural da Fundação</span>
                    <h1 id="textoDoComunicado"></h1>
                </div>
            </div>
            <div id="numeroDiscreto" style="opacity: 0;"></div>
            <div id="barraProgressoContainer"><div id="barraProgresso"></div></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8ZK0jSY-1E9y90TLfznxi9PI8mf_bJuc",
            authDomain: "festadafirmafcv.firebaseapp.com",
            projectId: "festadafirmafcv",
            storageBucket: "festadafirmafcv.firebasestorage.app",
            messagingSenderId: "930815464098",
            appId: "1:930815464098:web:890c2300a6e1a79abd3dfb"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('btnFullscreen').addEventListener('click', () => {
            const radio = document.getElementById('radioFCV');
            radio.play().catch(e => console.log(e));
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
                document.getElementById('btnFullscreen').style.display = 'none'; 
            }
        });

        setInterval(() => {
            let r = document.getElementById('radioFCV');
            let h = new Date().getHours();
            r.volume = (h >= 20 || h < 7) ? 0.3 : 1.0;
        }, 30000);

        setInterval(() => {
            const radio = document.getElementById('radioFCV');
            if (document.fullscreenElement) {
                radio.src = "https://stm17.srvstm.com:6944/stream?" + new Date().getTime();
                radio.load();
                radio.play().catch(e => console.log(e));
            }
        }, 3600000);

        document.getElementById('radioFCV').addEventListener('error', () => {
            setTimeout(() => {
                const radio = document.getElementById('radioFCV');
                if (document.fullscreenElement) {
                    radio.src = "https://stm17.srvstm.com:6944/stream?" + new Date().getTime();
                    radio.load();
                    radio.play().catch(e => console.log(e));
                }
            }, 5000);
        });

        const scaleBox = document.getElementById('tvScaleBox');
        let currentScaleX = 1;
        let currentScaleY = 1;
        
        function ajustarEscala() {
            currentScaleX = window.innerWidth / 1920;
            currentScaleY = window.innerHeight / 1080;
            scaleBox.style.transform = `translate(-50%, -50%) scale(${currentScaleX}, ${currentScaleY})`;
        }
        window.addEventListener('resize', ajustarEscala);
        ajustarEscala(); 

        function atualizarRelogio() {
            const agora = new Date();
            document.getElementById('relogioTV').innerText = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();

        let dadosClimaProntos = false;
        let isRaining = false;
        let isStorm = false;
        let isSunny = false;
        let climaAutomatico = 'sol';
        let modoClima = 'auto';
        
        const svgs = {
            sol: '<svg stroke="#f1c40f" viewBox="0 0 24 24" fill="none" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>',
            nuvem: '<svg stroke="#bdc3c7" viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>',
            solNuvem: '<svg stroke="#f1c40f" viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" stroke="#bdc3c7"/><circle cx="8" cy="8" r="3"/><path d="M8 2v1M8 13v1M2.34 4.34l.71.71M13.66 11.66l.71.71M1 8h1M13 8h1"/></svg>',
            chuva: '<svg stroke="#3498db" viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M16 13v8M8 13v8M12 15v8M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>',
            tempestade: '<svg stroke="#9b59b6" viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/><polyline points="13 11 9 17 15 17 11 23"/></svg>',
            lua: '<svg stroke="#ecf0f1" viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
        };

        function getClimaIcon(code, isNight = false) {
            if(code === 0) return { t: 'Limpo', i: isNight ? svgs.lua : svgs.sol };
            if(code >= 1 && code <= 3) return { t: 'Parc. Nublado', i: isNight ? svgs.nuvem : svgs.solNuvem };
            if(code >= 45 && code <= 48) return { t: 'Neblina', i: svgs.nuvem };
            if(code >= 51 && code <= 67) return { t: 'Chuva', i: svgs.chuva };
            if(code >= 80 && code <= 82) return { t: 'Pancadas', i: svgs.chuva };
            if(code >= 95) return { t: 'Tempestade', i: svgs.tempestade };
            return { t: 'Nublado', i: svgs.nuvem };
        }

        function mapearCodigoParaTema(code) {
            if(code === 0) return 'sol';
            if(code >= 1 && code <= 3) return 'parc_nublado';
            if(code >= 45 && code <= 48) return 'nublado';
            if((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 'chuva';
            if(code >= 95) return 'tempestade';
            return 'nublado';
        }

        async function processarClima() {
            try {
                const url = 'https://api.open-meteo.com/v1/forecast?latitude=-21.1306&longitude=-42.3664&daily=weathercode,temperature_2m_max,temperature_2m_min&hourly=temperature_2m,weathercode&timezone=America%2FSao_Paulo&forecast_days=7';
                const resp = await fetch(url);
                const data = await resp.json();
                const diasNomes = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
                let gridHtml = '';

                for(let i = 0; i < 7; i++) {
                    let dObj = new Date(data.daily.time[i] + 'T00:00:00');
                    let tituloDia = (i === 0) ? '<span class="dia-hoje">Hoje</span>' : diasNomes[dObj.getDay()];
                    let mainCode = data.daily.weathercode[i];
                    let max = Math.round(data.daily.temperature_2m_max[i]);
                    let min = Math.round(data.daily.temperature_2m_min[i]);
                    let iconeMain = getClimaIcon(mainCode, false);
                    let tempMedia = Math.round((max + min) / 2);
                    let baseIdx = i * 24;
                    let idxManha = baseIdx + 9;  
                    let idxTarde = baseIdx + 15; 
                    let idxNoite = baseIdx + 20; 
                    let tManha = Math.round(data.hourly.temperature_2m[idxManha]);
                    let cManha = getClimaIcon(data.hourly.weathercode[idxManha], false);
                    let tTarde = Math.round(data.hourly.temperature_2m[idxTarde]);
                    let cTarde = getClimaIcon(data.hourly.weathercode[idxTarde], false);
                    let tNoite = Math.round(data.hourly.temperature_2m[idxNoite]);
                    let cNoite = getClimaIcon(data.hourly.weathercode[idxNoite], true);

                    if (i === 0) {
                        climaAutomatico = mapearCodigoParaTema(mainCode);
                        if (modoClima === 'auto') {
                            aplicarClimaFundo(climaAutomatico);
                        }
                    }

                    gridHtml += `<div class="card-dia"><div class="dia-titulo">${tituloDia}</div><div class="icone-principal">${iconeMain.i}</div><div class="temp-principal">${tempMedia}°</div><div class="desc-principal">${iconeMain.t}</div><div class="maxmin"><div class="t-max">↑ ${max}°</div><div class="t-min">↓ ${min}°</div></div><div class="turnos-container"><div class="turno"><div class="turno-nome">manhã</div><div class="turno-icone">${cManha.i}</div><div class="turno-temp">${tManha}°</div></div><div class="turno"><div class="turno-nome">tarde</div><div class="turno-icone">${cTarde.i}</div><div class="turno-temp">${tTarde}°</div></div><div class="turno"><div class="turno-nome">noite</div><div class="turno-icone">${cNoite.i}</div><div class="turno-temp">${tNoite}°</div></div></div></div>`;
                }
                document.getElementById('gridClima').innerHTML = gridHtml;
                dadosClimaProntos = true;
            } catch (e) {
                console.log(e);
                dadosClimaProntos = false;
            }
        }

        processarClima();
        setInterval(processarClima, 1800000); 

        const sunCanvas = document.getElementById('sunCanvas');
        const sunCtx = sunCanvas.getContext('2d');
        let sunAnimId = null;
        let sunActive = false;
        let sunTime = 0;
        let sunRays = [];
        let sunParticles = [];

        function initSun() {
            sunCanvas.width = 1920;
            sunCanvas.height = 1080;
            sunRays = [];
            sunParticles = [];

            for (let i = 0; i < 16; i++) {
                sunRays.push({
                    baseAngle: (i / 16) * (Math.PI * 0.75) - 0.15,
                    spread: 0.04 + Math.random() * 0.07,
                    length: 1500 + Math.random() * 700,
                    alpha: 0.025 + Math.random() * 0.035, 
                    speed: (Math.random() * 0.0004 + 0.0001) * (i % 2 === 0 ? 1 : -1),
                    phase: Math.random() * Math.PI * 2
                });
            }

            for (let i = 0; i < 20; i++) {
                sunParticles.push({
                    x: Math.random() * 1920,
                    y: Math.random() * 1080,
                    r: Math.random() * 3 + 1,
                    vx: Math.random() * 0.3 + 0.1,
                    vy: (Math.random() - 0.5) * 0.2,
                    alpha: Math.random() * 0.25 + 0.05,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }
        initSun();

        function drawPolygonHex(ctx, x, y, radius, rotation) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = rotation + (i * Math.PI) / 3;
                const px = x + Math.cos(a) * radius;
                const py = y + Math.sin(a) * radius;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
        }

        function drawSun() {
            if (!sunActive) return;
            sunCtx.clearRect(0, 0, sunCanvas.width, sunCanvas.height);
            sunTime += 0.015;

            const sunX = 110;
            const sunY = 75;

            sunCtx.save();
            sunCtx.globalCompositeOperation = 'lighter';

            const pulse = Math.sin(sunTime) * 30;
            const ambGrad = sunCtx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 800 + pulse);
            ambGrad.addColorStop(0, 'rgba(255, 245, 200, 0.45)');
            ambGrad.addColorStop(0.2, 'rgba(255, 195, 80, 0.2)');
            ambGrad.addColorStop(0.5, 'rgba(255, 140, 30, 0.05)');
            ambGrad.addColorStop(1, 'rgba(255, 100, 0, 0)');
            sunCtx.fillStyle = ambGrad;
            sunCtx.fillRect(0, 0, sunCanvas.width, sunCanvas.height);

            sunRays.forEach(ray => {
                const currentAngle = ray.baseAngle + Math.sin(sunTime * 0.6 + ray.phase) * 0.05;
                const currentAlpha = ray.alpha * (0.7 + 0.3 * Math.sin(sunTime * 1.1 + ray.phase));

                const rayGrad = sunCtx.createRadialGradient(sunX, sunY, 20, sunX, sunY, ray.length);
                rayGrad.addColorStop(0, `rgba(255, 240, 180, ${currentAlpha * 1.4})`);
                rayGrad.addColorStop(0.4, `rgba(255, 210, 110, ${currentAlpha})`);
                rayGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

                sunCtx.fillStyle = rayGrad;
                sunCtx.beginPath();
                sunCtx.moveTo(sunX, sunY);
                sunCtx.arc(sunX, sunY, ray.length, currentAngle - ray.spread, currentAngle + ray.spread);
                sunCtx.closePath();
                sunCtx.fill();
            });

            const coreGrad = sunCtx.createRadialGradient(sunX, sunY, 5, sunX, sunY, 220);
            coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            coreGrad.addColorStop(0.25, 'rgba(255, 240, 190, 0.8)');
            coreGrad.addColorStop(0.55, 'rgba(255, 190, 80, 0.3)');
            coreGrad.addColorStop(1, 'rgba(255, 150, 30, 0)');
            sunCtx.fillStyle = coreGrad;
            sunCtx.beginPath();
            sunCtx.arc(sunX, sunY, 220, 0, Math.PI * 2);
            sunCtx.fill();

            sunParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x > 1920) p.x = -10;
                if (p.y < 0) p.y = 1080;
                if (p.y > 1080) p.y = 0;

                const pa = p.alpha * (0.5 + 0.5 * Math.sin(sunTime * 2 + p.phase));
                sunCtx.fillStyle = `rgba(255, 240, 180, ${pa})`;
                sunCtx.beginPath();
                sunCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                sunCtx.fill();
            });

            sunCtx.restore();
            sunAnimId = requestAnimationFrame(drawSun);
        }

        const rainCanvas = document.getElementById('rainCanvas');
        const ctx = rainCanvas.getContext('2d');
        const flashTempestade = document.getElementById('flashTempestade');
        const bgClimaEl = document.getElementById('bgClima');

        let drops = [];
        let splashes = [];
        let rainAnimId = null;
        let rainActive = false;

        let lightningTimer = null;
        let activeBolt = null;

        function initRain() {
            rainCanvas.width = 1920;
            rainCanvas.height = 1080;
            drops = [];
            splashes = [];
            for(let i=0; i<180; i++) {
                drops.push({
                    x: Math.random() * rainCanvas.width,
                    y: Math.random() * rainCanvas.height,
                    l: Math.random() * 20 + 10,
                    v: Math.random() * 15 + 20,
                    z: Math.random() 
                });
            }
        }
        initRain();

        function criarRaioGeometrico(startX) {
            let main = [];
            let branches = [];
            let currX = startX;
            let currY = 0;
            main.push({x: currX, y: currY});

            let maxH = 260 + Math.random() * 220;
            while (currY < maxH) {
                currX += (Math.random() - 0.5) * 75;
                currY += Math.random() * 25 + 12;
                main.push({x: currX, y: currY});

                if (Math.random() < 0.35 && branches.length < 4) {
                    let b = [{x: currX, y: currY}];
                    let bx = currX, by = currY;
                    let dir = Math.random() < 0.5 ? -1 : 1;
                    for (let j = 0; j < 5; j++) {
                        bx += dir * (Math.random() * 35 + 10);
                        by += Math.random() * 25 + 10;
                        b.push({x: bx, y: by});
                    }
                    branches.push(b);
                }
            }
            return { main, branches, alpha: 0.95 };
        }

        function dispararTrovao() {
            if (!isStorm || !camadaClima.classList.contains('visivel')) return;

            const posX = Math.floor(Math.random() * 76) + 12;
            const posY = Math.floor(Math.random() * 20) + 5;

            flashTempestade.style.background = `
                radial-gradient(circle at ${posX}% ${posY}%, 
                rgba(235, 245, 255, 0.85) 0%, 
                rgba(165, 200, 255, 0.45) 28%, 
                rgba(90, 120, 195, 0.18) 58%, 
                rgba(255, 255, 255, 0.04) 100%)
            `;

            if (Math.random() < 0.75) {
                activeBolt = criarRaioGeometrico((posX / 100) * 1920);
            }

            const padroes = [
                [0.95, 0.1, 0.45, 0, 0.8, 0],
                [0.7, 0.05, 1.0, 0.25, 0, 0.35, 0],
                [1.0, 0, 0.5, 0],
                [0.5, 0.15, 0.9, 0, 0.4, 0.1, 0.75, 0]
            ];
            const sequencia = padroes[Math.floor(Math.random() * padroes.length)];

            let delayAcumulado = 0;
            sequencia.forEach((opacidade) => {
                setTimeout(() => {
                    if (!isStorm) {
                        flashTempestade.style.opacity = 0;
                        bgClimaEl.classList.remove('trovao-ativo');
                        return;
                    }
                    flashTempestade.style.opacity = opacidade;
                    if (opacidade > 0.35) {
                        bgClimaEl.classList.add('trovao-ativo');
                        if (activeBolt && opacidade > 0.6) activeBolt.alpha = opacidade;
                    } else {
                        bgClimaEl.classList.remove('trovao-ativo');
                    }
                }, delayAcumulado);
                delayAcumulado += Math.floor(Math.random() * 55) + 35;
            });
        }

        function agendarProximoTrovao() {
            clearTimeout(lightningTimer);
            if (!isStorm || !camadaClima.classList.contains('visivel')) return;

            const intervalo = 2300 + Math.random() * 1400;
            lightningTimer = setTimeout(() => {
                dispararTrovao();
                agendarProximoTrovao();
            }, intervalo);
        }

        function pararTrovoes() {
            clearTimeout(lightningTimer);
            lightningTimer = null;
            activeBolt = null;
            if (flashTempestade) flashTempestade.style.opacity = 0;
            if (bgClimaEl) bgClimaEl.classList.remove('trovao-ativo');
        }

        function drawRain() {
            if(!rainActive) return;
            ctx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
            ctx.lineCap = 'round';

            if (isStorm && activeBolt && activeBolt.alpha > 0.02) {
                ctx.save();
                ctx.strokeStyle = `rgba(235, 245, 255, ${activeBolt.alpha})`;
                ctx.lineWidth = 3.2;
                ctx.shadowColor = 'rgba(140, 190, 255, 0.95)';
                ctx.shadowBlur = 22;

                ctx.beginPath();
                activeBolt.main.forEach((pt, idx) => {
                    if (idx === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                });
                ctx.stroke();

                ctx.lineWidth = 1.4;
                activeBolt.branches.forEach(branch => {
                    ctx.beginPath();
                    branch.forEach((pt, idx) => {
                        if (idx === 0) ctx.moveTo(pt.x, pt.y);
                        else ctx.lineTo(pt.x, pt.y);
                    });
                    ctx.stroke();
                });
                ctx.restore();

                activeBolt.alpha -= 0.07;
            }

            const cards = document.querySelectorAll('.card-dia');
            const cardRects = Array.from(cards).map(c => {
                const rect = c.getBoundingClientRect();
                return {
                    top: (rect.top - (window.innerHeight - 1080 * currentScaleY) / 2) / currentScaleY,
                    left: (rect.left - (window.innerWidth - 1920 * currentScaleX) / 2) / currentScaleX,
                    right: (rect.right - (window.innerWidth - 1920 * currentScaleX) / 2) / currentScaleX
                };
            });

            for (let i = splashes.length - 1; i >= 0; i--) {
                let s = splashes[i];
                ctx.beginPath();
                ctx.ellipse(s.x, s.y, s.r, s.r/3, 0, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 255, 255, ${s.a})`;
                ctx.lineWidth = 1;
                ctx.stroke();
                s.r += 1.2;
                s.a -= 0.08;
                if (s.a <= 0) splashes.splice(i, 1);
            }

            for (let i = 0; i < drops.length; i++) {
                let d = drops[i];
                ctx.strokeStyle = `rgba(255, 255, 255, ${d.z * 0.4 + 0.1})`;
                ctx.lineWidth = d.z * 1.5 + 0.5;
                
                ctx.beginPath();
                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x, d.y + d.l);
                ctx.stroke();

                d.y += d.v;

                let hit = false;
                if(d.z > 0.4) { 
                    for(let rect of cardRects) {
                        if (d.x > rect.left && d.x < rect.right && d.y + d.l > rect.top && d.y - d.v <= rect.top) {
                            hit = true;
                            splashes.push({x: d.x, y: rect.top, r: 2, a: 0.6});
                            break;
                        }
                    }
                }

                if (hit || d.y > rainCanvas.height) {
                    d.y = -20;
                    d.x = Math.random() * rainCanvas.width;
                    d.v = Math.random() * 15 + 20;
                }
            }
            rainAnimId = requestAnimationFrame(drawRain);
        }

        function atualizarMotoresClima() {
            if (camadaClima.classList.contains('visivel')) {
                if (isSunny) {
                    sunCanvas.style.display = 'block';
                    if (!sunActive) {
                        sunActive = true;
                        drawSun();
                    }
                } else {
                    sunActive = false;
                    cancelAnimationFrame(sunAnimId);
                    sunCanvas.style.display = 'none';
                }

                if (isRaining) {
                    rainCanvas.style.display = 'block';
                    if (!rainActive) {
                        rainActive = true;
                        drawRain();
                    }
                } else {
                    rainActive = false;
                    cancelAnimationFrame(rainAnimId);
                    rainCanvas.style.display = 'none';
                }

                if (isStorm) {
                    dispararTrovao();
                    agendarProximoTrovao();
                } else {
                    pararTrovoes();
                }
            } else {
                sunActive = false;
                cancelAnimationFrame(sunAnimId);
                sunCanvas.style.display = 'none';

                rainActive = false;
                cancelAnimationFrame(rainAnimId);
                rainCanvas.style.display = 'none';

                pararTrovoes();
            }
        }

        function aplicarClimaFundo(tipo) {
            const bgClima = document.getElementById('bgClima');
            bgClima.className = ''; 
            isRaining = false;
            isStorm = false;
            isSunny = false;
            
            if (tipo === 'sol') { bgClima.classList.add('clima-sol'); isSunny = true; }
            else if (tipo === 'parc_nublado') { bgClima.classList.add('clima-parc-nublado'); isSunny = true; }
            else if (tipo === 'nublado') bgClima.classList.add('clima-nublado');
            else if (tipo === 'chuva') { bgClima.classList.add('clima-chuva'); isRaining = true; }
            else if (tipo === 'tempestade') { bgClima.classList.add('clima-tempestade'); isRaining = true; isStorm = true; }
            
            atualizarMotoresClima();
        }

        let comunicadosAtivos = [];
        let fotosAprovadas = [];
        let indexCom = -1;
        let indexFoto = -1;
        let loopRodando = false;
        let mostrarClimaNaTV = true; 
        let mostrarFotosNaTV = false;
        let proximaAcao = 'CLIMA'; 
        let fotosExibidasNoCiclo = parseInt(localStorage.getItem('fcv_ciclo')) || 0;
        let maiorNumeroExibido = parseInt(localStorage.getItem('fcv_maior')) || 0;
        let timerCarregamento = null;
        let timerExibicao = null;
        let toggleImgLayer = 1;

        const camadaClima = document.getElementById('camadaClima');
        const camadaImagem1 = document.getElementById('camadaImagem1');
        const camadaImagem2 = document.getElementById('camadaImagem2');
        const camadaVideo = document.getElementById('camadaVideo');
        const videoPainel = document.getElementById('videoPainel');
        const camadaTexto = document.getElementById('camadaTexto');
        const textoDoComunicado = document.getElementById('textoDoComunicado');
        const aguardando = document.getElementById('aguardando');
        const barraProgresso = document.getElementById('barraProgresso');

        onSnapshot(doc(db, "controle_tv", "status_clima"), (docSnap) => { 
            if(docSnap.exists()) {
                mostrarClimaNaTV = docSnap.data().mostrar_clima !== false;
                modoClima = docSnap.data().modo_clima || 'auto';
            } else {
                mostrarClimaNaTV = true;
                modoClima = 'auto';
            }
            aplicarClimaFundo(modoClima === 'auto' ? climaAutomatico : modoClima);
        });

        onSnapshot(doc(db, "controle_tv", "status"), (docSnap) => { if(docSnap.exists()) mostrarFotosNaTV = docSnap.data().mostrar_fotos; });
        onSnapshot(doc(db, "controle_tv", "status_transicao"), (docSnap) => {
            if(docSnap.exists() && docSnap.data().efeito) document.body.setAttribute('data-transicao', docSnap.data().efeito);
            else document.body.setAttribute('data-transicao', 'fade');
        });

        onSnapshot(query(collection(db, "fotos_criancas"), where("status", "==", "aprovado")), (snapshot) => {
            fotosAprovadas = [];
            snapshot.forEach(doc => fotosAprovadas.push(doc.data()));
            fotosAprovadas.sort((a, b) => (a.numeroFila || 0) - (b.numeroFila || 0));
            if (fotosAprovadas.length > 0) {
                const ultimaFila = fotosAprovadas[fotosAprovadas.length - 1].numeroFila || 0;
                if (ultimaFila > maiorNumeroExibido && maiorNumeroExibido > 0) {
                    clearTimeout(window.timerFuraFila);
                    window.timerFuraFila = setTimeout(() => {
                        proximaAcao = 'FOTOS'; fotosExibidasNoCiclo = 0; localStorage.setItem('fcv_ciclo', 0);
                        if (loopRodando) decidirProximo();
                    }, 1000);
                }
            }
        });
       
        onSnapshot(collection(db, "comunicados_criancas"), (snapshot) => {
            comunicadosAtivos = [];
            const hojeISO = new Date().toLocaleDateString('en-CA'); 
            snapshot.forEach(doc => {
                const data = doc.data();
                if (data.ativo === false) return; 
                if (data.exibir_corredor === false) return;
                if (data.data_inicio && hojeISO < data.data_inicio) return; 
                if (data.data_fim && hojeISO > data.data_fim) return;       
                comunicadosAtivos.push(data);
            });
            comunicadosAtivos.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
            if (!loopRodando) { loopRodando = true; decidirProximo(); }
        });

        function animarBarra(tempoMs) {
            barraProgresso.style.transition = 'none';
            barraProgresso.style.width = '0%';
            setTimeout(() => {
                barraProgresso.style.transition = `width ${tempoMs}ms linear`;
                barraProgresso.style.width = '100%';
            }, 50);
        }

        function transitarPara(novaCamada) {
            const camadas = [camadaClima, camadaImagem1, camadaImagem2, camadaVideo, camadaTexto];
            camadas.forEach(c => {
                if (c === novaCamada) {
                    c.classList.remove('escondido');
                    c.classList.add('visivel');
                    c.style.zIndex = "2";
                } else {
                    if (c.classList.contains('visivel')) {
                        c.classList.remove('visivel');
                        c.classList.add('escondido');
                        c.style.zIndex = "1";
                        if (c === camadaVideo) { setTimeout(() => { videoPainel.pause(); videoPainel.src = ""; }, 800); }
                    }
                }
            });

            atualizarMotoresClima();

            if (novaCamada !== camadaImagem1 && novaCamada !== camadaImagem2) { document.getElementById('numeroDiscreto').style.opacity = 0; }
            aguardando.style.display = "none";
        }

        function decidirProximo() {
            clearTimeout(timerCarregamento);
            clearTimeout(timerExibicao);

            let temComs = comunicadosAtivos.length > 0;
            let temFotos = mostrarFotosNaTV && fotosAprovadas.length > 0;
            let podeExibirClima = mostrarClimaNaTV && dadosClimaProntos;

            if (!podeExibirClima && !temComs && !temFotos) {
                aguardando.style.display = "block"; transitarPara(null); setTimeout(decidirProximo, 2000); return;
            }

            if (proximaAcao === 'CLIMA') {
                if (podeExibirClima) { proximaAcao = temComs ? 'COMS' : (temFotos ? 'FOTOS' : 'CLIMA'); renderizarClima(); } 
                else { proximaAcao = temComs ? 'COMS' : 'FOTOS'; decidirProximo(); }
            } else if (proximaAcao === 'COMS') {
                if (temComs) {
                    renderizarComunicado();
                    if (indexCom === comunicadosAtivos.length - 1) { proximaAcao = temFotos ? 'FOTOS' : (podeExibirClima ? 'CLIMA' : 'COMS'); } 
                    else { proximaAcao = 'COMS'; }
                } else { proximaAcao = temFotos ? 'FOTOS' : 'CLIMA'; decidirProximo(); }
            } else if (proximaAcao === 'FOTOS') {
                if (temFotos) {
                    if (fotosExibidasNoCiclo >= 4) { 
                        fotosExibidasNoCiclo = 0; localStorage.setItem('fcv_ciclo', 0);
                        proximaAcao = podeExibirClima ? 'CLIMA' : (temComs ? 'COMS' : 'FOTOS'); decidirProximo();
                    } else { renderizarFoto(); }
                } else { proximaAcao = podeExibirClima ? 'CLIMA' : 'COMS'; decidirProximo(); }
            }
        }

        function renderizarClima() {
            transitarPara(camadaClima);
            animarBarra(15000); 
            timerExibicao = setTimeout(decidirProximo, 15000); 
        }

        function obterTempoValido(tempoRaw) { let t = parseInt(tempoRaw); return (isNaN(t) || t < 5000 || t > 60000) ? 15000 : t; }

        function renderizarComunicado() {
            indexCom = (indexCom + 1) >= comunicadosAtivos.length ? 0 : (indexCom + 1);
            const com = comunicadosAtivos[indexCom];
            let tempoTextoArte = obterTempoValido(com.tempo_exibicao);

            if (com.tipo === 'video' || com.url_video) {
                videoPainel.src = com.url_video;
                videoPainel.onloadedmetadata = function() {
                    let duracao = videoPainel.duration * 1000;
                    if (!duracao || isNaN(duracao) || duracao === Infinity) duracao = 15000;
                    transitarPara(camadaVideo);
                    videoPainel.play().catch(e => console.log(e));
                    animarBarra(duracao); timerExibicao = setTimeout(() => { decidirProximo(); }, duracao);
                };
                videoPainel.onerror = () => { setTimeout(decidirProximo, 1000); };
            } else if (com.tipo === 'imagem' || com.url_imagem) { 
                toggleImgLayer = toggleImgLayer === 1 ? 2 : 1;
                const camadaAtual = toggleImgLayer === 1 ? camadaImagem1 : camadaImagem2;
                const imgAtual = document.getElementById('imgPainel' + toggleImgLayer);
                const molduraAtual = document.getElementById('molduraFoto' + toggleImgLayer);
                const nomePanelAtual = document.getElementById('nomePainel' + toggleImgLayer);
                
                const imgPreload = new Image();
                timerCarregamento = setTimeout(() => { decidirProximo(); }, 8000); 

                imgPreload.onload = () => {
                    clearTimeout(timerCarregamento);
                    imgAtual.classList.add('modo-arte'); imgAtual.src = com.url_imagem || com.url_thumb;
                    molduraAtual.style.display = 'none'; nomePanelAtual.style.display = 'none'; document.getElementById('numeroDiscreto').style.opacity = 0;
                    transitarPara(camadaAtual);
                    animarBarra(tempoTextoArte); timerExibicao = setTimeout(() => { decidirProximo(); }, tempoTextoArte); 
                };
                imgPreload.onerror = () => { clearTimeout(timerCarregamento); setTimeout(decidirProximo, 1000); };
                imgPreload.src = com.url_imagem || com.url_thumb;
            } else { 
                textoDoComunicado.innerText = com.texto; transitarPara(camadaTexto);
                animarBarra(tempoTextoArte); timerExibicao = setTimeout(decidirProximo, tempoTextoArte); 
            }
        }

        function renderizarFoto() {
            indexFoto = (indexFoto + 1) >= fotosAprovadas.length ? 0 : (indexFoto + 1); 
            const fotoDaVez = fotosAprovadas[indexFoto];
            localStorage.setItem('fcv_ultimo', fotoDaVez.numeroFila);
            if ((fotoDaVez.numeroFila || 0) > maiorNumeroExibido) { maiorNumeroExibido = fotoDaVez.numeroFila; localStorage.setItem('fcv_maior', maiorNumeroExibido); }

            toggleImgLayer = toggleImgLayer === 1 ? 2 : 1;
            const camadaAtual = toggleImgLayer === 1 ? camadaImagem1 : camadaImagem2;
            const imgAtual = document.getElementById('imgPainel' + toggleImgLayer);
            const molduraAtual = document.getElementById('molduraFoto' + toggleImgLayer);
            const nomePanelAtual = document.getElementById('nomePainel' + toggleImgLayer);
            const lblNomeAtual = document.getElementById('lblNome' + toggleImgLayer);
            const lblSetorAtual = document.getElementById('lblSetor' + toggleImgLayer);

            const imgPreload = new Image();
            timerCarregamento = setTimeout(() => { decidirProximo(); }, 8000); 
            
            imgPreload.onload = () => {
                clearTimeout(timerCarregamento); fotosExibidasNoCiclo++; localStorage.setItem('fcv_ciclo', fotosExibidasNoCiclo);
                imgAtual.classList.remove('modo-arte'); imgAtual.src = fotoDaVez.url_imagem || fotoDaVez.url_thumb;
                document.getElementById('numeroDiscreto').innerText = fotoDaVez.numeroFila ? `#${fotoDaVez.numeroFila}` : "";
                document.getElementById('numeroDiscreto').style.opacity = 1; molduraAtual.style.display = 'block';

                if(fotoDaVez.nome === "Não Informado" && !fotoDaVez.setor) { nomePanelAtual.style.display = 'none'; } 
                else { nomePanelAtual.style.display = 'block'; lblNomeAtual.innerText = fotoDaVez.nome; lblSetorAtual.innerText = fotoDaVez.setor ? fotoDaVez.setor : ""; }

                transitarPara(camadaAtual);
                animarBarra(7000); timerExibicao = setTimeout(() => { decidirProximo(); }, 7000);
            };
            imgPreload.onerror = () => { clearTimeout(timerCarregamento); setTimeout(decidirProximo, 1000); };
            imgPreload.src = fotoDaVez.url_imagem || fotoDaVez.url_thumb;
        }
    </script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('PWA Service Worker registrado com sucesso:', reg);
                }).catch(err => {
                    console.log('Falha ao registrar PWA:', err);
                });
            });
        }
    </script>
</body>
