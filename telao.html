<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Corporativa - Comunicados</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="logo%20icon%20TV%20do%20Ponto%20FCV.png" type="image/png">
    <link rel="apple-touch-icon" href="logo%20icon%20TV%20do%20Ponto%20FCV.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; padding: 0; background-color: #000; color: white; 
            font-family: 'Montserrat', sans-serif; overflow: hidden;
        }

        #viewportWrapper {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden;
        }

        .tv-scale-box {
            width: 1920px; height: 1080px; 
            position: absolute; top: 50%; left: 50%;
            transform-origin: center center;
            background-color: #000; 
        }
        
        #btnFullscreen {
            position: fixed; top: 20px; right: 20px; z-index: 99999;
            background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.5);
            padding: 10px 15px; border-radius: 8px; cursor: pointer; font-family: 'Montserrat', sans-serif;
            font-weight: 600; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: 0.3s;
        }
        #btnFullscreen:hover { background: rgba(255,255,255,0.4); }

        .marca-dagua {
            position: absolute; top: 25px; right: 40px; width: 200px;
            opacity: 0.7; z-index: 9990; pointer-events: none;
        }

        #relogioTV {
            position: absolute; bottom: 40px; right: 40px;
            background: rgba(255, 255, 255, 0.5); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-radius: 12px; color: #224387; 
            padding: 10px 25px; text-align: center;
            font-size: 32px; font-weight: 700; letter-spacing: 2px;
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out; 
            z-index: 9990; pointer-events: none;
        }

        .container-master { 
            width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; 
            position: absolute; top:0; left:0; 
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out; 
        }

        .escondido { opacity: 0; pointer-events: none; transform: scale(1.02); }
        .visivel { opacity: 1; pointer-events: auto; transform: scale(1); }

        #imgPainel { width: 100%; height: 100%; object-fit: contain; position: relative; z-index: 2; }
        .modo-arte { object-fit: cover !important; }

        #containerTexto {
            width: 80%; text-align: center; background: rgba(34, 67, 135, 0.85);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 80px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
        }
        #textoDoComunicado { font-size: 70px; font-weight: 700; line-height: 1.3; margin: 0; color: #fff; }
        .aviso-label { font-size: 30px; color: #ff9800; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; display: block;}

        #aguardando { font-size: 20px; color: #ff9800; font-weight: 600; z-index: 20; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; }

        #barraProgressoContainer { position: absolute; bottom: 0; left: 0; width: 100%; height: 10px; background: rgba(255,255,255,0.1); z-index: 20; }
        #barraProgresso { height: 100%; width: 0%; background: linear-gradient(to right, #224387, #002061); }
    </style>
</head>
<body>

    <button id="btnFullscreen">Tela Cheia</button>

    <div id="viewportWrapper">
        <div class="tv-scale-box" id="tvScaleBox">
            
            <img src="MKTFCV.png" class="marca-dagua" alt="MKT FCV">
            <div id="relogioTV" class="escondido">--:--</div>

            <div id="aguardando">Aguardando comunicados...</div>

            <div class="container-master escondido" id="camadaImagem">
                <img id="imgPainel" src="" alt="Painel">
            </div>

            <div class="container-master escondido" id="camadaTexto">
                <div id="containerTexto">
                    <span class="aviso-label">Mural da Fundação</span>
                    <h1 id="textoDoComunicado"></h1>
                </div>
            </div>

            <div id="barraProgressoContainer"><div id="barraProgresso"></div></div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        function ajustarEscala() {
            const scaleBox = document.getElementById('tvScaleBox');
            const scaleX = window.innerWidth / 1920;
            const scaleY = window.innerHeight / 1080;
            scaleBox.style.transform = `translate(-50%, -50%) scale(${scaleX}, ${scaleY})`;
        }
        window.addEventListener('resize', ajustarEscala);
        ajustarEscala(); 

        document.getElementById('btnFullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
                document.getElementById('btnFullscreen').style.display = 'none'; 
            }
        });

        function atualizarRelogio() {
            const agora = new Date();
            const horaString = agora.toLocaleTimeString('pt-BR', { 
                timeZone: 'America/Sao_Paulo', 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            document.getElementById('relogioTV').innerText = horaString;
        }
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();

        const firebaseConfig = {
            apiKey: "AIzaSyB8ZK0jSY-1E9y90TLfznxi9PI8mf_bJuc",
            authDomain: "festadafirmafcv.firebaseapp.com",
            projectId: "festadafirmafcv",
            storageBucket: "festadafirmafcv.firebasestorage.app",
            messagingSenderId: "930815464098",
            appId: "1:930815464098:web:890c2300a6e1a79abd3dfb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let comunicadosAtivos = [];
        let indexCom = -1;
        let loopRodando = false;

        let timerCarregamento = null;
        let timerTransicao = null;
        let timerExibicao = null;

        const camadaImagem = document.getElementById('camadaImagem');
        const imgPainel = document.getElementById('imgPainel');
        const camadaTexto = document.getElementById('camadaTexto');
        const textoDoComunicado = document.getElementById('textoDoComunicado');
        const aguardando = document.getElementById('aguardando');
        const barraProgresso = document.getElementById('barraProgresso');
        const relogioTV = document.getElementById('relogioTV');

        onSnapshot(collection(db, "comunicados_criancas"), (snapshot) => {
            comunicadosAtivos = [];
            snapshot.forEach(doc => comunicadosAtivos.push(doc.data()));
            
            if (comunicadosAtivos.length > 0 && !loopRodando) {
                aguardando.style.display = "none";
                loopRodando = true;
                decidirProximo();
            } else if (comunicadosAtivos.length === 0) {
                loopRodando = false;
                transicaoApagarTudo();
                aguardando.style.display = "block";
            }
        });

        function animarBarra(tempoMs) {
            barraProgresso.style.transition = 'none';
            barraProgresso.style.width = '0%';
            setTimeout(() => {
                barraProgresso.style.transition = `width ${tempoMs}ms linear`;
                barraProgresso.style.width = '100%';
            }, 50);
        }

        function decidirProximo() {
            if (comunicadosAtivos.length === 0) {
                loopRodando = false;
                aguardando.style.display = "block";
                transicaoApagarTudo();
                return;
            }
            renderizarComunicado();
        }

        function renderizarComunicado() {
            indexCom = (indexCom + 1) >= comunicadosAtivos.length ? 0 : (indexCom + 1);
            const com = comunicadosAtivos[indexCom];

            if(com.tipo === 'imagem' || com.url_imagem) {
                const imgPreload = new Image();
                
                timerCarregamento = setTimeout(() => { 
                    imgPreload.onload = null; imgPreload.onerror = null; imgPreload.src = "";
                    decidirProximo(); 
                }, 8000); 

                imgPreload.onload = () => {
                    clearTimeout(timerCarregamento);

                    transicaoApagarTudo();
                    
                    timerTransicao = setTimeout(() => {
                        imgPainel.classList.add('modo-arte'); 
                        imgPainel.src = com.url_imagem || com.url_thumb;
                        
                        camadaImagem.classList.remove('escondido'); camadaImagem.classList.add('visivel');
                        relogioTV.classList.remove('escondido'); relogioTV.classList.add('visivel');
                        
                        animarBarra(15000); 
                        timerExibicao = setTimeout(() => {
                            imgPreload.onload = null; imgPreload.onerror = null; imgPreload.src = "";
                            decidirProximo();
                        }, 15000); 
                    }, 800);
                };
                imgPreload.onerror = () => { 
                    clearTimeout(timerCarregamento); 
                    imgPreload.onload = null; imgPreload.onerror = null; imgPreload.src = "";
                    decidirProximo(); 
                };
                imgPreload.src = com.url_imagem || com.url_thumb;
            } else {
                transicaoApagarTudo();
                
                timerTransicao = setTimeout(() => {
                    textoDoComunicado.innerText = com.texto;
                    
                    camadaTexto.classList.remove('escondido'); camadaTexto.classList.add('visivel');
                    relogioTV.classList.remove('escondido'); relogioTV.classList.add('visivel');
                    
                    animarBarra(15000); 
                    timerExibicao = setTimeout(decidirProximo, 15000); 
                }, 800);
            }
        }

        function transicaoApagarTudo() {
            camadaImagem.classList.remove('visivel'); camadaImagem.classList.add('escondido');
            camadaTexto.classList.remove('visivel'); camadaTexto.classList.add('escondido');
            relogioTV.classList.remove('visivel'); relogioTV.classList.add('escondido');
        }
    </script>
</body>
</html>
