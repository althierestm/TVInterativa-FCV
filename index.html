<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia das Crianças - Fundação</title>

    <link rel="icon" href="logo%20icon%20TV%20do%20Ponto%20FCV.png" type="image/png">
    <link rel="apple-touch-icon" href="logo%20icon%20TV%20do%20Ponto%20FCV.png">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; text-align: center; background-color: #f0f8ff; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #ff9800; }
        h2 { color: #333; margin-bottom: 5px; font-weight: 700; }
        p { color: #666; margin-bottom: 25px; font-size: 14px; }
        .obs { font-size: 11px; color: #888; margin-top: -5px; margin-bottom: 20px; text-align: left; padding-left: 5%; }
        
        input[type="text"] { font-family: 'Montserrat', sans-serif; width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        input[type="file"] { display: none; }

        .botoes-acao { display: flex; gap: 10px; width: 90%; margin: 0 auto; }
        .btn-acao { font-family: 'Montserrat', sans-serif; flex: 1; padding: 12px; border: 1px solid #ccc; background-color: #f9f9f9; color: #333; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-acao:hover { background-color: #eee; }

        #previewContainer { display: none; margin-top: 20px; }
        #previewContainer p { margin-bottom: 5px; font-size: 12px; color: #555; font-weight: 600; }
        #fotoPreview { max-width: 90%; max-height: 250px; border-radius: 8px; object-fit: cover; border: 1px solid #ccc; }

        #btnEnviar { font-family: 'Montserrat', sans-serif; background: linear-gradient(to right, #002061, #061e50); color: white; border: none; padding: 15px 20px; width: 90%; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: 700; margin-top: 20px; }
        #btnEnviar:hover { opacity: 0.9; }
        #btnEnviar:disabled { background: #ccc; cursor: not-allowed; }
        
        .aviso-privacidade {
            font-size: 11px; color: #d84315; background-color: #fbe9e7;
            padding: 10px 12px; border-radius: 8px; margin-top: 15px;
            margin-bottom: 5px; font-weight: 600; line-height: 1.4; text-align: center;
        }

        .ramal-duvidas { font-size: 12px; color: #666; margin-top: 10px; font-weight: 400; }
        .ramal-duvidas strong { font-weight: 700; color: #002061; }
        
        #mensagem { margin-top: 20px; font-weight: 600; font-size: 15px; }
        .senha-destaque { font-size: 24px; color: #224387; font-weight: 700; margin-top: 10px; display: block; }

        .rodape-assinatura { margin-top: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 10px; }
        .rodape-assinatura img { width: 130px; opacity: 0.6; margin-bottom: -20px; }
        .rodape-assinatura span { font-size: 7px; color: #999; font-weight: 700; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Dia das Crianças FCV</h2>
        <p>Envie sua foto de infância para a TV do Corredor!</p>

        <input type="text" id="nomeInput" placeholder="Seu nome (ex: João Silva)">
        <input type="text" id="setorInput" placeholder="Seu setor (ex: TI, Marketing)">
        <div class="obs">O nome e setor serão exibidos na TV com a foto.</div>
        
        <div class="botoes-acao">
            <button class="btn-acao" id="btnGaleria">Escolher Foto da Galeria</button>
        </div>

        <input type="file" id="inputGaleria" accept="image/*">

        <div id="previewContainer">
            <p>Sua foto de infância:</p>
            <img id="fotoPreview" src="" alt="Pré-visualização">
        </div>
        
        <button id="btnEnviar">Enviar para a TV</button>
        
        <div class="aviso-privacidade">
            ⚠️ Envie somente a sua foto, respeitando o direito de não querer participar dos demais colaboradores.
        </div>
        
        <div class="ramal-duvidas">Ramal para dúvidas: <strong>7849</strong></div>
        <div id="mensagem"></div>
    </div>

    <div class="rodape-assinatura">
        <img src="MKTFCV.png" alt="MKT FCV">
        <span>by Althieres Dias</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8ZK0jSY-1E9y90TLfznxi9PI8mf_bJuc",
            authDomain: "festadafirmafcv.firebaseapp.com",
            projectId: "festadafirmafcv",
            storageBucket: "festadafirmafcv.firebasestorage.app",
            messagingSenderId: "930815464098",
            appId: "1:930815464098:web:890c2300a6e1a79abd3dfb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "767bd935a2b389a4fbfad4f8d92bfae7"; 

        let arquivoSelecionado = null;

        const btnGaleria = document.getElementById('btnGaleria');
        const inputGaleria = document.getElementById('inputGaleria');
        const previewContainer = document.getElementById('previewContainer');
        const fotoPreview = document.getElementById('fotoPreview');
        const btnEnviar = document.getElementById('btnEnviar');
        const mensagem = document.getElementById('mensagem');

        btnGaleria.addEventListener('click', () => inputGaleria.click());

        function processarArquivo(evento) {
            const arquivo = evento.target.files[0];
            if (arquivo) {
                arquivoSelecionado = arquivo;
                const leitor = new FileReader();
                leitor.onload = function(e) {
                    fotoPreview.src = e.target.result;
                    previewContainer.style.display = 'block';
                }
                leitor.readAsDataURL(arquivo);
            }
        }

        inputGaleria.addEventListener('change', processarArquivo);

        btnEnviar.addEventListener('click', async () => {
            const nome = document.getElementById('nomeInput').value || "Anônimo";
            const setor = document.getElementById('setorInput').value || "";

            if (!arquivoSelecionado) {
                mensagem.innerText = "Por favor, escolha uma foto primeiro.";
                mensagem.style.color = "red";
                return;
            }

            mensagem.innerText = "Gerando sua senha e enviando...";
            mensagem.style.color = "orange";
            btnEnviar.disabled = true;

            const formData = new FormData();
            formData.append("image", arquivoSelecionado);

            try {
                
                const ticketAleatorio = Math.floor(1000 + Math.random() * 9000); 
                const tempoExato = Date.now(); 

                const respostaImgBB = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const dadosImgBB = await respostaImgBB.json();
                
                await addDoc(collection(db, "fotos_criancas"), {
                    nome: nome,
                    setor: setor,
                    numeroFila: tempoExato,    
                    ticket: ticketAleatorio,   
                    url_imagem: dadosImgBB.data.url,
                    url_thumb: dadosImgBB.data.thumb.url,
                    status: "pendente",
                    timestamp: serverTimestamp()
                });

                mensagem.innerHTML = `✅ Sucesso! Foto enviada para moderação. Aguarde sua vez na TV:<br><span class="senha-destaque">Sua Senha: #${ticketAleatorio}</span>`;
                mensagem.style.color = "green";
                
                document.getElementById('nomeInput').value = "";
                document.getElementById('setorInput').value = "";
                arquivoSelecionado = null;
                previewContainer.style.display = 'none';

            } catch (erro) {
                console.error(erro);
                mensagem.innerText = "Ocorreu um erro ao enviar. Tente novamente.";
                mensagem.style.color = "red";
            } finally {
                btnEnviar.disabled = false;
            }
        });
    </script>
</body>
</html>
