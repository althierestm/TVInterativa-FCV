<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FCV Interativa</title>

    <link rel="icon" href="logo%20icon%20TV%20do%20Ponto%20FCV.png" type="image/png">
    <link rel="apple-touch-icon" href="logo%20icon%20TV%20do%20Ponto%20FCV.png">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; text-align: center; background-color: #f0f8ff; padding: 20px; transition: background-color 0.5s; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #ff9800; transition: border-color 0.5s; opacity: 0; animation: fadeIn 0.5s forwards; }
        
        @keyframes fadeIn { to { opacity: 1; } }

        h2 { color: #333; margin-bottom: 5px; font-weight: 700; min-height: 29px; }
        p { color: #666; margin-bottom: 25px; font-size: 14px; min-height: 17px; }
        .obs { font-size: 11px; color: #888; margin-top: -5px; margin-bottom: 20px; text-align: left; padding-left: 5%; }
        
        input[type="text"] { font-family: 'Montserrat', sans-serif; width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        input[type="file"] { display: none; }

        .botoes-acao { display: flex; gap: 10px; width: 90%; margin: 0 auto; }
        .btn-acao { font-family: 'Montserrat', sans-serif; flex: 1; padding: 12px; border: 1px solid #ccc; background-color: #f9f9f9; color: #333; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.3s; }
        .btn-acao:hover { background-color: #eee; }
        #btnGaleria { background-color: #ff9800; color: white; border-color: #e68a00; }
        #btnGaleria:hover { background-color: #e68a00; }

        #previewContainer { display: none; margin-top: 20px; position: relative; width: 90%; margin-left: auto; margin-right: auto; }
        #previewContainer p { margin-bottom: 5px; font-size: 12px; color: #555; font-weight: 600; }
        
        .box-preview { position: relative; width: 100%; aspect-ratio: 9/16; background-color: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        #fotoPreview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #molduraPreview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; z-index: 10; display: none; }

        #btnEnviar { font-family: 'Montserrat', sans-serif; background: linear-gradient(to right, #002061, #061e50); color: white; border: none; padding: 15px 20px; width: 90%; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: 700; margin-top: 20px; transition: 0.3s; }
        #btnEnviar:hover { opacity: 0.9; }
        #btnEnviar:disabled { background: #ccc !important; cursor: not-allowed; }
        
        .aviso-privacidade {
            font-size: 11px; color: #d84315; background-color: #fbe9e7;
            padding: 10px 12px; border-radius: 8px; margin-top: 15px;
            margin-bottom: 5px; font-weight: 600; line-height: 1.4; text-align: center;
        }

        .ramal-duvidas { font-size: 12px; color: #666; margin-top: 10px; font-weight: 400; }
        .ramal-duvidas strong { font-weight: 700; color: #002061; }
        
        #mensagem { margin-top: 20px; font-weight: 600; font-size: 14px; line-height: 1.5; padding: 0 10px; }
        .senha-destaque { font-size: 24px; color: #224387; font-weight: 700; margin-top: 10px; display: block; }

        .rodape-assinatura { margin-top: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 10px; }
        .rodape-assinatura img { width: 130px; opacity: 0.6; margin-bottom: -20px; }
        .rodape-assinatura span { font-size: 7px; color: #999; font-weight: 700; letter-spacing: 1px; }

        button, input { touch-action: manipulation; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h2 id="tituloAcao"></h2>
        <p id="subtituloAcao"></p>

        <input type="text" id="nomeInput" placeholder="Seu nome (ex: João do Violão)">
        <input type="text" id="setorInput" placeholder="Seu setor (ex: TI, Marketing)">
        <div class="obs">nome e setor não serão exibidos no Painel de LED.</div>
        
        <div class="botoes-acao">
            <button class="btn-acao" id="btnGaleria">Abrir Câmera</button>
        </div>

        <input type="file" id="inputGaleria" accept="image/*" capture="environment">

        <div id="previewContainer">
            <p>Prévia da sua foto no painel:</p>
            <div class="box-preview">
                <img id="fotoPreview" src="" alt="Sua foto">
                <img id="molduraPreview" src="" alt="Moldura">
            </div>
        </div>
        
        <button id="btnEnviar">Enviar para a o Painel de LED</button>
        
        <div class="aviso-privacidade" id="avisoPrivacidade" style="display:none;"></div>
        
        <div class="ramal-duvidas" id="boxRamal" style="display:none;">Ramal para dúvidas: <strong id="textoRamal"></strong></div>
        <div id="mensagem"></div>
    </div>

    <div class="rodape-assinatura">
        <img src="MKTFCV.png" alt="MKT FCV">
        <span>by Althieres Dias</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8ZK0jSY-1E9y90TLfznxi9PI8mf_bJuc",
            authDomain: "festadafirmafcv.firebaseapp.com",
            projectId: "festadafirmafcv",
            storageBucket: "festadafirmafcv.firebasestorage.app",
            messagingSenderId: "930815464098",
            appId: "1:930815464098:web:890c2300a6e1a79abd3dfb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "767bd935a2b389a4fbfad4f8d92bfae7"; 

        let arquivoSelecionado = null;
        let modoFestaAtivo = false;
        let unsubTextos = null;

        const molduraPreview = document.getElementById('molduraPreview');
        const container = document.getElementById('mainContainer');
        const btnGaleria = document.getElementById('btnGaleria');
        const btnEnviar = document.getElementById('btnEnviar');
        const inputGaleria = document.getElementById('inputGaleria');

        function configurarVisualNormal() {
            document.body.style.backgroundColor = '#ffd5c1';
            container.style.borderTopColor = '#ff9800';
            btnGaleria.style.backgroundColor = '#ff9800';
            btnGaleria.style.borderColor = '#e68a00';
            btnGaleria.innerText = "Escolher Foto da Galeria";
            inputGaleria.removeAttribute("capture");
            btnEnviar.style.background = 'linear-gradient(to right, #002061, #ffd5c1)';
        }

        function configurarVisualFesta() {
            document.body.style.backgroundColor = '#ffffff';
            container.style.borderTopColor = '#e94560';
            btnGaleria.style.backgroundColor = '#e94560';
            btnGaleria.style.borderColor = '#d83a54';
            btnGaleria.innerText = "Abrir Câmera";
            inputGaleria.setAttribute("capture", "environment");
            btnEnviar.style.background = 'linear-gradient(to right, #e94560, #d83a54)';
        }

        onSnapshot(doc(db, "config_geral", "modo_app"), (configDoc) => {
            if (configDoc.exists() && configDoc.data().evento_festa) {
                modoFestaAtivo = true;
                configurarVisualFesta();

                if (unsubTextos) unsubTextos();
                unsubTextos = onSnapshot(doc(db, "config_festa", "textos"), (textoDoc) => {
                    const d = textoDoc.exists() ? textoDoc.data() : {};
                    document.getElementById('tituloAcao').innerText = d.titulo || "Tardezinha FCV 2026";
                    document.getElementById('subtituloAcao').innerText = d.subtitulo || "Envie sua foto para o Telão da Festa!";
                    
                    const aviso = document.getElementById('avisoPrivacidade');
                    if(d.aviso) { aviso.innerText = d.aviso; aviso.style.display = 'block'; } 
                    else { aviso.style.display = 'none'; }

                    const boxRamal = document.getElementById('boxRamal');
                    if(d.exibir_ramal !== false && d.ramal) {
                        document.getElementById('textoRamal').innerText = d.ramal;
                        boxRamal.style.display = 'block';
                    } else { boxRamal.style.display = 'none'; }
                });

                onSnapshot(doc(db, "config_festa", "visual"), (docSnap) => {
                    if (docSnap.exists() && docSnap.data().url_overlay) {
                        molduraPreview.src = docSnap.data().url_overlay;
                        molduraPreview.style.display = 'block';
                    } else {
                        molduraPreview.style.display = 'none';
                    }
                });

            } else {
                modoFestaAtivo = false;
                if (unsubTextos) { unsubTextos(); unsubTextos = null; }
                
                configurarVisualNormal();
                document.getElementById('tituloAcao').innerText = "Dia das Crianças FCV";
                document.getElementById('subtituloAcao').innerText = "Envie sua foto de infância para a TV do Corredor!";
                
                document.getElementById('avisoPrivacidade').innerText = "⚠️ Envie somente a sua foto, respeitando o direito de não querer participar dos demais colaboradores.";
                document.getElementById('avisoPrivacidade').style.display = 'block';
                
                document.getElementById('textoRamal').innerText = "7849";
                document.getElementById('boxRamal').style.display = 'block';
                
                molduraPreview.style.display = 'none';
            }
        });

        const previewContainer = document.getElementById('previewContainer');
        const fotoPreview = document.getElementById('fotoPreview');
        const mensagem = document.getElementById('mensagem');

        btnGaleria.addEventListener('click', () => inputGaleria.click());

        function processarArquivo(evento) {
            const arquivo = evento.target.files[0];
            if (arquivo) {
                arquivoSelecionado = arquivo;
                const leitor = new FileReader();
                leitor.onload = function(e) {
                    fotoPreview.src = e.target.result;
                    previewContainer.style.display = 'block';
                    mensagem.innerText = "";
                }
                leitor.readAsDataURL(arquivo);
            }
        }

        inputGaleria.addEventListener('change', processarArquivo);

        btnEnviar.addEventListener('click', async () => {
            const nome = document.getElementById('nomeInput').value || "Anônimo";
            const setor = document.getElementById('setorInput').value || "";

            if (!arquivoSelecionado) {
                mensagem.innerText = modoFestaAtivo ? "Por favor, abra a câmera e tire uma foto primeiro." : "Por favor, escolha uma foto primeiro.";
                mensagem.style.color = "red";
                return;
            }

            mensagem.innerText = modoFestaAtivo ? "A enviar foto ao vivo..." : "A enviar arquivo...";
            mensagem.style.color = "orange";
            btnEnviar.disabled = true;

            const formData = new FormData();
            formData.append("image", arquivoSelecionado);

            try {
                const respostaImgBB = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const dadosImgBB = await respostaImgBB.json();
                
                if (!dadosImgBB || !dadosImgBB.success) {
                    throw new Error(`Erro do ImgBB`);
                }

                mensagem.innerText = "A processar envio...";
                const colecaoAlvo = modoFestaAtivo ? "fotos_festa" : "fotos_criancas";

                let meuNumeroFila = 0;
                if (!modoFestaAtivo) {
                    const querySnapshot = await getDocs(collection(db, colecaoAlvo));
                    let maxFila = 0;
                    querySnapshot.forEach((doc) => {
                        const dados = doc.data();
                        const num = Number(dados.numeroFila);
                        if (!isNaN(num) && num < 100000 && num > maxFila) {
                            maxFila = num;
                        }
                    });
                    meuNumeroFila = maxFila + 1;
                }
                
                const docData = {
                    nome: nome,
                    setor: setor,
                    url_imagem: dadosImgBB.data.url,
                    url_thumb: dadosImgBB.data.thumb.url,
                    status: "pendente",
                    timestamp: serverTimestamp()
                };

                if (!modoFestaAtivo) docData.numeroFila = meuNumeroFila;
                await addDoc(collection(db, colecaoAlvo), docData);

                if (modoFestaAtivo) {
                    mensagem.innerHTML = `✅ Sucesso! Sua foto foi enviada e está aguardando aprovação para aparecer no telão.`;
                } else {
                    mensagem.innerHTML = `✅ Sucesso! Aguarde sua vez na TV:<br><span class="senha-destaque">Sua Foto é a Nº ${meuNumeroFila}</span>`;
                }
                
                mensagem.style.color = "green";
                
                document.getElementById('nomeInput').value = "";
                document.getElementById('setorInput').value = "";
                arquivoSelecionado = null;
                previewContainer.style.display = 'none';

            } catch (erro) {
                console.error(erro);
                mensagem.innerText = "Ocorreu um erro ao enviar. Tente novamente.";
                mensagem.style.color = "red";
            } finally {
                btnEnviar.disabled = false;
            }
        });
    </script>
</body>
</html>
