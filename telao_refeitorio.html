<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>TV Refeitório - FCV</title>
    <link rel="icon" href="logo%20icon%20TV%20do%20Ponto%20FCV.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script>
        if ('caches' in window) {
            caches.keys().then(function(names) {
                for (let name of names) caches.delete(name);
            });
        }
    </script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: white; font-family: 'Montserrat', sans-serif; overflow: hidden; }
        #viewportWrapper { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; }
        .tv-scale-box { width: 1920px; height: 1080px; position: absolute; top: 50%; left: 50%; transform-origin: center center; background-color: #000; }
        #btnFullscreen { position: fixed; top: 20px; right: 20px; z-index: 99999; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.5); padding: 10px 15px; border-radius: 8px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-weight: 600; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: 0.3s; }
        #btnFullscreen:hover { background: rgba(255,255,255,0.4); }
        .marca-dagua { position: absolute; top: 25px; right: 40px; width: 200px; opacity: 0.7; z-index: 9990; pointer-events: none; }
        #relogioTV { position: absolute; bottom: 40px; right: 40px; background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 4px 15px rgba(0,0,0,0.3); border-radius: 12px; color: #224387; padding: 10px 25px; text-align: center; font-size: 32px; font-weight: 700; letter-spacing: 2px; z-index: 9990; pointer-events: none; }
        body[data-transicao="fade"] .container-master { transition: opacity 0.8s ease; }
        body[data-transicao="fade"] .escondido { opacity: 0; pointer-events: none; }
        body[data-transicao="fade"] .visivel { opacity: 1; pointer-events: auto; }
        body[data-transicao="slide"] .container-master { transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out; }
        body[data-transicao="slide"] .escondido { transform: translateX(100%); opacity: 0; pointer-events: none; }
        body[data-transicao="slide"] .visivel { transform: translateX(0); opacity: 1; pointer-events: auto; }
        body[data-transicao="zoom"] .container-master { transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out; }
        body[data-transicao="zoom"] .escondido { transform: scale(0.9); opacity: 0; pointer-events: none; }
        body[data-transicao="zoom"] .visivel { transform: scale(1); opacity: 1; pointer-events: auto; }
        .container-master { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: absolute; top:0; left:0; }
        #imgPainel1, #imgPainel2 { width: 100%; height: 100%; object-fit: contain; position: relative; z-index: 2; }
        .modo-arte { object-fit: cover !important; }
        #containerTexto { width: 80%; text-align: center; background: rgba(34, 67, 135, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 80px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        #textoDoComunicado { font-size: 70px; font-weight: 700; line-height: 1.3; margin: 0; color: #fff; }
        .aviso-label { font-size: 30px; color: #ff9800; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; display: block;}
        #aguardando { font-size: 20px; color: #7f8c8d; font-weight: 600; z-index: 20; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; }
        #barraProgressoContainer { position: absolute; bottom: 0; left: 0; width: 100%; height: 10px; background: rgba(255,255,255,0.1); z-index: 20; }
        #barraProgresso { height: 100%; width: 0%; background: linear-gradient(to right, #2894f9, #002061); }
        #iframeCardapio { width: 100%; height: 100%; border: none; background: #ffffff; }
    </style>
</head>
<body data-transicao="fade">

    <audio id="radioFCV" src="https://stm17.srvstm.com:6944/stream" preload="none" crossorigin="anonymous"></audio>

    <button id="btnFullscreen">Tela Cheia</button>

    <div id="viewportWrapper">
        <div class="tv-scale-box" id="tvScaleBox">
            
            <img src="MKTFCV.png" class="marca-dagua" alt="MKT FCV">
            <div id="relogioTV">--:--</div>

            <div id="aguardando">Aguardando informações da rede...</div>

            <div class="container-master escondido" id="camadaCardapio">
                <iframe id="iframeCardapio" src="about:blank"></iframe>
            </div>

            <div class="container-master escondido" id="camadaImagem1">
                <img id="imgPainel1" src="" alt="Painel">
            </div>

            <div class="container-master escondido" id="camadaImagem2">
                <img id="imgPainel2" src="" alt="Painel">
            </div>

            <div class="container-master escondido" id="camadaVideo">
                <video id="videoPainel" class="modo-arte" src="" playsinline muted></video>
            </div>

            <div class="container-master escondido" id="camadaTexto">
                <div id="containerTexto">
                    <span class="aviso-label">Mural da Fundação</span>
                    <h1 id="textoDoComunicado"></h1>
                </div>
            </div>

            <div id="barraProgressoContainer"><div id="barraProgresso"></div></div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8ZK0jSY-1E9y90TLfznxi9PI8mf_bJuc",
            authDomain: "festadafirmafcv.firebaseapp.com",
            projectId: "festadafirmafcv",
            storageBucket: "festadafirmafcv.firebasestorage.app",
            messagingSenderId: "930815464098",
            appId: "1:930815464098:web:890c2300a6e1a79abd3dfb"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('btnFullscreen').addEventListener('click', () => {
            const radio = document.getElementById('radioFCV');
            radio.play().catch(e => console.log(e));
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
                document.getElementById('btnFullscreen').style.display = 'none'; 
            }
        });

        setInterval(() => {
            let r = document.getElementById('radioFCV');
            let h = new Date().getHours();
            r.volume = (h >= 20 || h < 7) ? 0.3 : 1.0;
        }, 30000);

        setInterval(() => {
            const radio = document.getElementById('radioFCV');
            if (document.fullscreenElement) {
                radio.pause();
                radio.src = "https://stm17.srvstm.com:6944/stream?" + new Date().getTime();
                radio.load();
                radio.play().catch(e => console.log(e));
            }
        }, 3600000);

        document.getElementById('radioFCV').addEventListener('error', () => {
            setTimeout(() => {
                const radio = document.getElementById('radioFCV');
                if (document.fullscreenElement) {
                    radio.src = "https://stm17.srvstm.com:6944/stream?" + new Date().getTime();
                    radio.load();
                    radio.play().catch(e => console.log(e));
                }
            }, 5000);
        });

        function ajustarEscala() {
            const scaleBox = document.getElementById('tvScaleBox');
            const scaleX = window.innerWidth / 1920;
            const scaleY = window.innerHeight / 1080;
            scaleBox.style.transform = `translate(-50%, -50%) scale(${scaleX}, ${scaleY})`;
        }
        window.addEventListener('resize', ajustarEscala);
        ajustarEscala(); 

        function atualizarRelogio() {
            const agora = new Date();
            document.getElementById('relogioTV').innerText = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();

        let todosComunicados = [];
        let comunicadosAtivos = [];
        let indexCom = -1;
        let loopRodando = false;
        let proximaAcao = 'CARDAPIO'; 
        let linkCardapio = "http://fcvconnect/fcvnow/cardapio/semana";

        let timerCarregamento = null;
        let timerExibicao = null;
        let dataUltimoRefresh = null;
        let toggleImgLayer = 1;

        setInterval(() => {
            let agora = new Date();
            if (agora.getDay() === 1 && agora.getHours() === 7 && agora.getMinutes() === 0) {
                if (dataUltimoRefresh !== agora.toDateString()) {
                    dataUltimoRefresh = agora.toDateString();
                    const baseUrl = linkCardapio.split('?')[0];
                    document.getElementById('iframeCardapio').src = baseUrl + "?v=" + agora.getTime();
                }
            }
        }, 10000);

        onSnapshot(doc(db, "controle_tv", "status_transicao"), (docSnap) => {
            if(docSnap.exists() && docSnap.data().efeito) {
                document.body.setAttribute('data-transicao', docSnap.data().efeito);
            } else {
                document.body.setAttribute('data-transicao', 'fade');
            }
        });

        onSnapshot(doc(db, "controle_tv", "status_refeitorio"), (docSnap) => {
            if(docSnap.exists() && docSnap.data().link_cardapio) {
                linkCardapio = docSnap.data().link_cardapio;
                document.getElementById('iframeCardapio').src = linkCardapio;
            } else {
                document.getElementById('iframeCardapio').src = linkCardapio;
            }
        });

        const camadaCardapio = document.getElementById('camadaCardapio');
        const camadaImagem1 = document.getElementById('camadaImagem1');
        const camadaImagem2 = document.getElementById('camadaImagem2');
        const camadaVideo = document.getElementById('camadaVideo');
        const videoPainel = document.getElementById('videoPainel');
        const camadaTexto = document.getElementById('camadaTexto');
        const textoDoComunicado = document.getElementById('textoDoComunicado');
        const aguardando = document.getElementById('aguardando');
        const barraProgresso = document.getElementById('barraProgresso');

        function verificarExpirado(data, hojeISO, horaAtual) {
            if (data.data_fim) {
                const hFim = data.hora_fim || "23:59";
                if (hojeISO > data.data_fim) return true;
                if (hojeISO === data.data_fim && horaAtual > hFim) return true;
            } else if (data.hora_fim) {
                if (horaAtual > data.hora_fim) return true;
            }
            return false;
        }

        function verificarNaoIniciado(data, hojeISO, horaAtual) {
            if (data.data_inicio) {
                const hIni = data.hora_inicio || "00:00";
                if (hojeISO < data.data_inicio) return true;
                if (hojeISO === data.data_inicio && horaAtual < hIni) return true;
            } else if (data.hora_inicio) {
                if (horaAtual < data.hora_inicio) return true;
            }
            return false;
        }

        function filtrarComunicadosAtivos() {
            const agora = new Date();
            const hojeISO = agora.toLocaleDateString('en-CA');
            const horaAtual = agora.toTimeString().slice(0, 5);
            const novaLista = [];

            todosComunicados.forEach(data => {
                if (data.ativo === false) return;

                if (verificarExpirado(data, hojeISO, horaAtual)) {
                    data.ativo = false;
                    updateDoc(doc(db, "comunicados_criancas", data.id), { ativo: false }).catch(e => console.log(e));
                    return;
                }

                if (data.exibir_refeitorio !== true) return;
                if (verificarNaoIniciado(data, hojeISO, horaAtual)) return;

                novaLista.push(data);
            });

            novaLista.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
            comunicadosAtivos = novaLista;

            if (!loopRodando) {
                loopRodando = true;
                decidirProximo();
            }
        }

        onSnapshot(collection(db, "comunicados_criancas"), (snapshot) => {
            todosComunicados = [];
            snapshot.forEach(docSnap => {
                todosComunicados.push({ id: docSnap.id, ...docSnap.data() });
            });
            filtrarComunicadosAtivos();
        });

        setInterval(filtrarComunicadosAtivos, 15000);

        function animarBarra(tempoMs) {
            barraProgresso.style.transition = 'none';
            barraProgresso.style.width = '0%';
            setTimeout(() => {
                barraProgresso.style.transition = `width ${tempoMs}ms linear`;
                barraProgresso.style.width = '100%';
            }, 50);
        }

        function transitarPara(novaCamada) {
            const jaVisivel = novaCamada && novaCamada.classList.contains('visivel');
            const camadas = [camadaCardapio, camadaImagem1, camadaImagem2, camadaVideo, camadaTexto];
            camadas.forEach(c => {
                if (c === novaCamada) {
                    if (!jaVisivel) {
                        c.classList.remove('escondido');
                        c.classList.add('visivel');
                        c.style.zIndex = "2";
                    }
                } else {
                    if (c.classList.contains('visivel')) {
                        c.classList.remove('visivel');
                        c.classList.add('escondido');
                        c.style.zIndex = "1";
                        if (c === camadaVideo) {
                            videoPainel.onloadedmetadata = null;
                            videoPainel.onerror = null;
                            setTimeout(() => {
                                if (!camadaVideo.classList.contains('visivel')) {
                                    videoPainel.pause();
                                    videoPainel.removeAttribute('src');
                                    videoPainel.load();
                                }
                            }, 800);
                        }
                        if (c === camadaImagem1 || c === camadaImagem2) {
                            const imgInativa = c.querySelector('img');
                            setTimeout(() => {
                                if (!c.classList.contains('visivel') && imgInativa) {
                                    imgInativa.removeAttribute('src');
                                }
                            }, 900);
                        }
                    }
                }
            });
            aguardando.style.display = "none";
        }

        function decidirProximo() {
            clearTimeout(timerCarregamento);
            clearTimeout(timerExibicao);
            videoPainel.onloadedmetadata = null;
            videoPainel.onerror = null;

            filtrarComunicadosAtivos();

            let temComs = comunicadosAtivos.length > 0;
            document.getElementById('barraProgressoContainer').style.display = temComs ? 'block' : 'none';

            if (proximaAcao === 'CARDAPIO') {
                renderizarCardapio();
                proximaAcao = temComs ? 'COMS' : 'CARDAPIO';
            } else if (proximaAcao === 'COMS') {
                if (temComs) {
                    renderizarComunicado();
                    if (indexCom === comunicadosAtivos.length - 1) { 
                        proximaAcao = 'CARDAPIO';
                    } else {
                        proximaAcao = 'COMS';
                    }
                } else {
                    proximaAcao = 'CARDAPIO';
                    decidirProximo();
                }
            }
        }

        function renderizarCardapio() {
            transitarPara(camadaCardapio);
            animarBarra(25000); 
            timerExibicao = setTimeout(decidirProximo, 25000); 
        }

        function obterTempoValido(tempoRaw) {
            let t = parseInt(tempoRaw);
            return (isNaN(t) || t < 5000 || t > 60000) ? 15000 : t;
        }

        function renderizarComunicado() {
            indexCom = (indexCom + 1) >= comunicadosAtivos.length ? 0 : (indexCom + 1);
            const com = comunicadosAtivos[indexCom];
            
            let tempoTextoArte = obterTempoValido(com.tempo_exibicao);

            if (com.tipo === 'video' || com.url_video) {
                videoPainel.onloadedmetadata = null;
                videoPainel.onerror = null;
                videoPainel.src = com.url_video;
                timerCarregamento = setTimeout(() => {
                    videoPainel.onloadedmetadata = null;
                    videoPainel.onerror = null;
                    decidirProximo();
                }, 10000);
                
                videoPainel.onloadedmetadata = function() {
                    clearTimeout(timerCarregamento);
                    videoPainel.onloadedmetadata = null;
                    let duracao = videoPainel.duration * 1000;
                    if (!duracao || isNaN(duracao) || duracao === Infinity) duracao = 15000;
                    
                    transitarPara(camadaVideo);
                    videoPainel.play().catch(e => console.log(e));
                    
                    animarBarra(duracao); 
                    timerExibicao = setTimeout(() => {
                        videoPainel.onerror = null;
                        decidirProximo(); 
                    }, duracao);
                };
                
                videoPainel.onerror = () => {
                    clearTimeout(timerCarregamento);
                    videoPainel.onloadedmetadata = null;
                    videoPainel.onerror = null;
                    setTimeout(decidirProximo, 1000);
                };
                
            } else if (com.tipo === 'imagem' || com.url_imagem) { 
                toggleImgLayer = toggleImgLayer === 1 ? 2 : 1;
                const camadaAtual = toggleImgLayer === 1 ? camadaImagem1 : camadaImagem2;
                const imgAtual = document.getElementById('imgPainel' + toggleImgLayer);
                
                let imgPreload = new Image();
                timerCarregamento = setTimeout(() => { imgPreload = null; decidirProximo(); }, 8000); 

                imgPreload.onload = () => {
                    clearTimeout(timerCarregamento);
                    imgAtual.classList.add('modo-arte'); 
                    imgAtual.src = com.url_imagem || com.url_thumb;
                    
                    transitarPara(camadaAtual);
                    animarBarra(tempoTextoArte); 
                    timerExibicao = setTimeout(() => { decidirProximo(); }, tempoTextoArte);
                    imgPreload = null;
                };
                imgPreload.onerror = () => { clearTimeout(timerCarregamento); imgPreload = null; setTimeout(decidirProximo, 1000); };
                imgPreload.src = com.url_imagem || com.url_thumb;
            } else { 
                textoDoComunicado.innerText = com.texto;
                transitarPara(camadaTexto);
                animarBarra(tempoTextoArte); 
                timerExibicao = setTimeout(decidirProximo, tempoTextoArte); 
            }
        }
    </script>
</body>
</html>
